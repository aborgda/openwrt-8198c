name: RTL8198C OpenWrt 24.10 build

on:
  workflow_dispatch:
  push:
    branches:
      - openwrt-24.10-clean
    paths:
      - 'target/linux/realtek/**'
      - '.github/workflows/rtl8198c-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.device }} (Linux 6.6)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        device: [gn866_ac, lg7100, sk337]
    steps:
      - name: Checkout OpenWrt 24.10 source
        uses: actions/checkout@v4
        with:
          ref: openwrt-24.10-clean
          submodules: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            time perl python3 python3-pyelftools

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure RTL8198C target
        run: |
          make defconfig
          cat >> .config <<'EOF'
          CONFIG_TARGET_realtek=y
          CONFIG_TARGET_realtek_rtl8198c=y
          CONFIG_TARGET_realtek_rtl8198c_DEVICE_${{ matrix.device }}=y
          EOF
          make defconfig
          grep -E 'CONFIG_TARGET_realtek(_rtl8198c|_rtl8198c_DEVICE_)|CONFIG_LINUX_6_6' .config || true

      - name: Download sources
        run: make download -j$(nproc)

      - name: Build firmware
        run: |
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: Upload build logs and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl8198c-${{ matrix.device }}-build
          if-no-files-found: warn
          path: |
            bin/targets/realtek/rtl8198c/**
            build.log
