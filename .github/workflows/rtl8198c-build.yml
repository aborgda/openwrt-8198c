name: RTL8198C firmware build

on:
  workflow_dispatch:
  push:
    paths:
      - 'target/linux/realtek/**'
      - '.github/workflows/rtl8198c-build.yml'
  pull_request:
    paths:
      - 'target/linux/realtek/**'
      - '.github/workflows/rtl8198c-build.yml'

permissions:
  contents: read

concurrency:
  group: rtl8198c-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y             build-essential clang flex bison g++ gawk gcc-multilib g++-multilib             gettext git libncurses-dev libssl-dev python3 python3-distutils             python3-setuptools rsync swig unzip zlib1g-dev file wget
          df -h

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure RTL8198C devices
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_realtek=y
          CONFIG_TARGET_realtek_rtl8198c=y
          CONFIG_TARGET_realtek_rtl8198c_DEVICE_gn866_ac=y
          CONFIG_TARGET_realtek_rtl8198c_DEVICE_realtek_lg7100=y
          CONFIG_TARGET_realtek_rtl8198c_DEVICE_realtek_sk337=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_DEVEL=y
          EOF
          make defconfig
          grep -E 'CONFIG_TARGET_(realtek|realtek_rtl8198c)' .config

      - name: Download sources
        run: make download -j4

      - name: Build firmware
        run: make -j2 V=s

      - name: Upload firmware images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl8198c-firmware
          path: |
            bin/targets/realtek/rtl8198c/
            logs/
          if-no-files-found: warn
          retention-days: 14
