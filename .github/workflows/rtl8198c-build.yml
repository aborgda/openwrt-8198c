name: RTL8198C GN866 AC build attempt

on:
  push:
    branches: [rtl8198c-gn866-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            cpio ecj fastjar java-propose-classpath libelf-dev
      - name: Validate target registration
        run: |
          grep -q 'rtl8198c' target/linux/realtek/Makefile
          test -f target/linux/realtek/rtl8198c.mk
          test -f target/linux/realtek/rtl8198c/target.mk
          test -f target/linux/realtek/rtl8198c/config-6.6
          test -f target/linux/realtek/image/rtl8198c.mk
      - name: Configure OpenWrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_realtek=y
          CONFIG_TARGET_realtek_rtl8198c=y
          CONFIG_TARGET_BOARD="realtek"
          CONFIG_TARGET_SUBTARGET="rtl8198c"
          EOF
          make defconfig
      - name: Build host tools
        run: |
          make -j2 V=s tools/install
      - name: Build target toolchain
        run: |
          make -j2 V=s toolchain/install
      - name: Prepare kernel config non-interactively
        run: |
          make -j2 V=s target/linux/prepare
          KERNEL_DIR="$(find build_dir/target-* -maxdepth 1 -type d -name 'linux-6.6.*' -print -quit)"
          test -n "$KERNEL_DIR"
          echo "Normalizing kernel Kconfig in $KERNEL_DIR"
          make -C "$KERNEL_DIR" ARCH=mips olddefconfig
      - name: Compile RTL8198C Linux target
        run: |
          make -j2 V=s target/linux/compile
