name: GN866 AC OpenWrt build

on:
  push:
    branches: [master]
    paths:
      - 'target/linux/realtek/**'
      - '.github/workflows/gn866-ac-build.yml'
      - 'package/**'
      - 'Makefile'
      - 'include/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y \
            build-essential gcc g++ make gcc-multilib g++-multilib \
            bison flex gettext git rsync unzip zip xz-utils \
            bzip2 gzip file cpio patch wget curl gawk \
            python3 python3-distutils libncurses5-dev \
            libncurses-dev zlib1g-dev libssl-dev \
            libc6-i386 lib32z1 libstdc++6:i386 zlib1g:i386

      - name: Configure GN866 AC
        shell: bash
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_realtek=y
          CONFIG_TARGET_realtek_rtl8198c=y
          CONFIG_TARGET_realtek_rtl8198c_DEVICE_gn866_ac=y
          EOF
          make defconfig

      - name: Build GN866 AC
        shell: bash
        env:
          FORCE_UNSAFE_CONFIGURE: "1"
        run: |
          make -j4 V=s


      - name: Verify GN866 CR6C image
        shell: bash
        run: |
          IMAGE="$(find bin/targets/realtek/rtl8198c -maxdepth 1 -type f -name '*factory.bin' -print -quit)"
          test -n "$IMAGE"
          python3 - "$IMAGE" <<'PY'
          import struct, sys
          p = sys.argv[1]
          data = open(p, "rb").read()
          assert data[:4] == b"cr6c", data[:4]
          off = 0
          sigs = []
          while off < len(data):
              sig, ram, flash, length = struct.unpack_from(">4sIII", data, off)
              off += 16
              payload = data[off:off + length]
              assert len(payload) == length
              assert sig in (b"cr6c", b"r6cr"), sig
              assert sum(struct.unpack_from(">H", payload, n)[0] for n in range(0, len(payload), 2)) & 0xffff == 0
              sigs.append(sig.decode())
              off += length
          assert sigs == ["cr6c", "r6cr"], sigs
          print("CR6C/R6CR verified:", p, "bytes:", len(data))
          PY

      - name: Collect GN866 firmware
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          find bin/targets/realtek/rtl8198c -maxdepth 1 -type f -exec cp -v {} artifacts/ \; 2>/dev/null || true
          if find artifacts -maxdepth 1 -type f | grep -qv 'README-GN866.txt'; then
            echo 'BUILD_RESULT=HAS_OUTPUT' > artifacts/BUILD-STATUS.txt
          else
            echo 'BUILD_RESULT=NO_OUTPUT' > artifacts/BUILD-STATUS.txt
          fi
          printf '%s\n' \
            'GN866 AC target added to OpenWrt RTL8198C.' \
            'Flash size taken from the supplied GN866 dump: 16 MiB.' \
            'GN866 RTL8192ER/RTL8812BRH vendor wireless support is not supplied by this OpenWrt tree.' \
            'The device-tree RAM declaration is 128 MiB and should be board-verified.' \
            > artifacts/README-GN866.txt
          ls -lh artifacts || true

      - name: Upload GN866 firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GN866-AC-openwrt
          path: artifacts/
          if-no-files-found: warn
