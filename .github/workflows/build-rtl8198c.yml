name: RTL8198C firmware build

on:
  push:
    branches:
      - fix/rtl8198c-gn866-lg7100-sk337-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential clang flex bison g++ gawk gcc-multilib g++-multilib             gettext git libncurses-dev libssl-dev python3 python3-distutils             python3-setuptools rsync swig time unzip zlib1g-dev file wget             cpio ecj fastjar java-propose-classpath libelf-dev libfuse-dev             libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev             libpython3-dev libreadline-dev libsqlite3-dev libtool lzop             msmtp nano p7zip-full patch pkgconf subversion xsltproc             zlib1g-dev
          df -h

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure RTL8198C device builds
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_realtek=y
          CONFIG_TARGET_realtek_rtl8198c=y
          CONFIG_TARGET_realtek_rtl8198c_DEVICE_gn866_ac=y
          CONFIG_TARGET_realtek_rtl8198c_DEVICE_lg7100=y
          CONFIG_TARGET_realtek_rtl8198c_DEVICE_mercury_gapm-7100=y
          CONFIG_TARGET_realtek_rtl8198c_DEVICE_sk337=y
          CONFIG_TARGET_realtek_rtl8198c_DEVICE_f-secure_sense=y
          CONFIG_PACKAGE_luci=y
          EOF
          make defconfig
          grep -E '^(CONFIG_TARGET_realtek|CONFIG_TARGET.*rtl8198c|CONFIG_PACKAGE_luci)=' .config || true

      - name: Build firmware
        run: |
          make -j2 V=s

      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl8198c-gn866-lg7100-sk337-firmware
          path: |
            bin/targets/realtek/rtl8198c/*
            bin/targets/realtek/rtl8198c/sha256sums
          if-no-files-found: warn
          retention-days: 14
