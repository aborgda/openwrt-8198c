name: RTL8198C firmware build

on:
  push:
    branches:
      - master
      - "fix/rtl8198c-gn866-lg7100-sk337"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rtl8198c-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev libelf-dev device-tree-compiler file wget \
            time xsltproc zstd python3 python3-pyelftools

      - name: Verify target definitions
        run: |
          test -f target/linux/realtek/image/rtl8198c.mk
          test -f target/linux/realtek/dts-5.10/rtl8198c_gn866_ac.dts
          test -f target/linux/realtek/dts-5.10/rtl8198c_lg7100.dts
          test -f target/linux/realtek/dts-5.10/rtl8198c_sk337.dts
          grep -q 'SUBTARGETS:.*rtl8198c' target/linux/realtek/Makefile

      - name: Update feeds
        run: ./scripts/feeds update -a

      - name: Install feeds
        run: ./scripts/feeds install -a

      - name: Configure RTL8198C devices
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_realtek=y
          CONFIG_TARGET_realtek_rtl8198c=y
          CONFIG_TARGET_realtek_rtl8198c_DEVICE_gn866_ac=y
          CONFIG_TARGET_realtek_rtl8198c_DEVICE_lg7100=y
          CONFIG_TARGET_realtek_rtl8198c_DEVICE_sk337=y
          CONFIG_DEVEL=y
          EOF
          make defconfig

      - name: Download sources
        run: make download -j4

      - name: Build firmware
        run: |
          set -o pipefail
          make -j2 V=s 2>&1 | tee build-rtl8198c.log
        shell: bash

      - name: Upload firmware images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rtl8198c-gn866-lg7100-sk337-firmware
          path: |
            bin/targets/realtek/rtl8198c/
            !bin/targets/realtek/rtl8198c/packages/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rtl8198c-build-error-log
          path: build-rtl8198c.log
          if-no-files-found: warn
          retention-days: 14
